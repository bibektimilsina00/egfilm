# ============================================================
# 🚀 EGFilm Monorepo – Production Deploy (egfilm + egsport + egtv)
#   Builds a per-app image from docker/Dockerfile.app (turbo prune)
#   and deploys all apps via deploy.sh on the production server.
# ============================================================
name: 🚀 Monorepo – Production Deploy

on:
  push:
    branches: [main, deploy]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      force_deploy:
        description: "Force deployment (skip change detection)"
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  NODE_VERSION: "20"
  PNPM_VERSION: "9.15.0"

concurrency:
  group: deploy-monorepo-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  validate:
    name: 🔍 Pre-Deployment Validation
    runs-on: ubuntu-latest
    outputs:
      should-deploy: ${{ steps.plan.outputs.should-deploy }}
      version: ${{ steps.version.outputs.version }}
      matrix: ${{ steps.plan.outputs.matrix }}
      apps: ${{ steps.plan.outputs.apps }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Per-app change detection. A change under a single app rebuilds only
      # that app; a change to shared code (packages, lockfile, docker, deploy
      # scripts, workflow) rebuilds every app since they all share it.
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            shared:
              - 'packages/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - 'docker/**'
              - 'docker-compose.yml'
              - 'deploy.sh'
              - '.github/workflows/**'
            egfilm:
              - 'apps/egfilm/**'
            egsport:
              - 'apps/egsport/**'
            egtv:
              - 'apps/egtv/**'
            egblog:
              - 'apps/egblog/**'
            egadmin:
              - 'apps/egadmin/**'

      - id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            VERSION="${GITHUB_REF_NAME//\//-}-${GITHUB_SHA::8}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "🏷️  Version: $VERSION"

      - id: plan
        env:
          SHARED: ${{ steps.changes.outputs.shared }}
          C_EGFILM: ${{ steps.changes.outputs.egfilm }}
          C_EGSPORT: ${{ steps.changes.outputs.egsport }}
          C_EGTV: ${{ steps.changes.outputs.egtv }}
          C_EGBLOG: ${{ steps.changes.outputs.egblog }}
          C_EGADMIN: ${{ steps.changes.outputs.egadmin }}
          FORCE: ${{ github.event.inputs.force_deploy }}
        run: |
          set -euo pipefail
          # app -> "public_app_name|app_url_var|default_url"
          declare -A META=(
            [egfilm]="EGFilm|EGFILM_URL|https://egfilm.xyz"
            [egsport]="EGSport|EGSPORT_URL|https://sports.egfilm.xyz"
            [egtv]="EGTV|EGTV_URL|https://tv.egfilm.xyz"
            [egblog]="EGFilm Blog|EGBLOG_URL|https://blog.egfilm.xyz"
            [egadmin]="EGFilm Admin|EGADMIN_URL|https://admin.egfilm.xyz"
          )
          ORDER=(egfilm egsport egtv egblog egadmin)

          rebuild_all=false
          if [[ "$SHARED" == "true" || "$FORCE" == "true" || "$GITHUB_REF" == refs/tags/* ]]; then
            rebuild_all=true
            echo "🔁 Shared change / forced — rebuilding all apps"
          fi

          selected=()
          for app in "${ORDER[@]}"; do
            var="C_${app^^}"
            if [[ "$rebuild_all" == "true" || "${!var:-false}" == "true" ]]; then
              selected+=("$app")
            fi
          done

          if [[ ${#selected[@]} -eq 0 ]]; then
            echo "should-deploy=false" >> "$GITHUB_OUTPUT"
            echo 'matrix={"include":[]}' >> "$GITHUB_OUTPUT"
            echo "apps=" >> "$GITHUB_OUTPUT"
            echo "ℹ️  No app changes – skipping deployment"
            exit 0
          fi

          include=""
          for app in "${selected[@]}"; do
            IFS='|' read -r pub var url <<< "${META[$app]}"
            item="{\"app\":\"$app\",\"public_app_name\":\"$pub\",\"app_url_var\":\"$var\",\"default_url\":\"$url\"}"
            include="${include:+$include,}$item"
          done
          echo "should-deploy=true" >> "$GITHUB_OUTPUT"
          echo "matrix={\"include\":[$include]}" >> "$GITHUB_OUTPUT"
          echo "apps=${selected[*]}" >> "$GITHUB_OUTPUT"
          echo "🚀 Deploying: ${selected[*]}"

  ci:
    name: 🧪 Lint, Type-check, Test & Build
    runs-on: ubuntu-latest
    needs: validate
    if: needs.validate.outputs.should-deploy == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Prisma generate
        run: pnpm --filter @egfilm/db db:generate

      - name: Lint
        run: pnpm run lint

      - name: Type-check apps
        run: pnpm --filter egfilm --filter egsport --filter egtv --filter egblog --filter egadmin type-check

      - name: Unit tests
        run: pnpm --filter @egfilm/services test

      # Note: we used to run `pnpm run build` here, but each app is
      # already rebuilt inside its docker image in the matrix job below.
      # Doing it twice wasted ~2 minutes per deploy with zero benefit.

  security-scan:
    name: 🔒 Trivy Security Scan
    runs-on: ubuntu-latest
    needs: validate
    if: needs.validate.outputs.should-deploy == 'true'
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: CRITICAL,HIGH

  build:
    name: 🐳 Build & Push (${{ matrix.app }})
    runs-on: ubuntu-latest
    needs: [validate]
    if: needs.validate.outputs.should-deploy == 'true'
    strategy:
      fail-fast: false
      # Only the apps flagged as changed by the validate job (per-app or all
      # on a shared change) are built here.
      matrix: ${{ fromJSON(needs.validate.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.REGISTRY_TOKEN || secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.app }}
          tags: |
            type=raw,value=${{ needs.validate.outputs.version }}
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.app
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
          build-args: |
            APP_NAME=${{ matrix.app }}
            NEXT_PUBLIC_APP_NAME=${{ matrix.public_app_name }}
            NEXT_PUBLIC_APP_URL=${{ vars[matrix.app_url_var] || matrix.default_url }}
            NEXT_PUBLIC_TMDB_API_KEY=${{ secrets.TMDB_API_KEY }}
            NEXT_PUBLIC_BLOG_SITE_URL=${{ vars.BLOG_SITE_URL || 'https://blog.egfilm.xyz' }}
            NEXT_PUBLIC_EGFILM_URL=${{ vars.EGFILM_URL || 'https://egfilm.xyz' }}
            NEXT_PUBLIC_EGSPORT_URL=${{ vars.EGSPORT_URL || 'https://sports.egfilm.xyz' }}
            NEXT_PUBLIC_EGTV_URL=${{ vars.EGTV_URL || 'https://tv.egfilm.xyz' }}
            NEXT_PUBLIC_TURN_SERVER=${{ vars.TURN_SERVER || '' }}
            NEXT_PUBLIC_TURN_USERNAME=${{ vars.TURN_USERNAME || '' }}
            NEXT_PUBLIC_BUILD_VERSION=${{ needs.validate.outputs.version }}
            NEXT_PUBLIC_GIT_SHA=${{ github.sha }}
            NEXT_PUBLIC_GA_MEASUREMENT_ID=${{ vars.GA_MEASUREMENT_ID }}

  deploy:
    name: 🚀 Zero-Downtime Deploy
    runs-on: ubuntu-latest
    needs: [validate, ci, build]
    environment:
      name: production
      url: ${{ vars.EGTV_URL || 'https://tv.egfilm.xyz' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            deploy.sh
            docker-compose.yml
          sparse-checkout-cone-mode: false

      - name: 📝 Create .env
        run: |
          OWNER="${{ github.repository_owner }}"
          REG="${{ env.REGISTRY }}"
          VER="${{ needs.validate.outputs.version }}"
          cat > .env <<EOF
          NODE_ENV=production
          NEXT_TELEMETRY_DISABLED=1
          REGISTRY=${REG}
          DEPLOY_USER=${{ github.actor }}
          REGISTRY_TOKEN=${{ secrets.REGISTRY_TOKEN }}

          DATABASE_URL=${{ secrets.DATABASE_URL }}
          POSTGRES_DB=${{ secrets.POSTGRES_DB }}
          POSTGRES_USER=${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}

          AUTH_SECRET=${{ secrets.NEXTAUTH_SECRET }}
          AUTH_TRUST_HOST=true
          AUTH_COOKIE_DOMAIN=${{ vars.AUTH_COOKIE_DOMAIN || '.egfilm.xyz' }}
          TMDB_API_KEY=${{ secrets.TMDB_API_KEY }}

          EGFILM_IMAGE_NAME=${REG}/${OWNER}/egfilm:${VER}
          EGSPORT_IMAGE_NAME=${REG}/${OWNER}/egsport:${VER}
          EGTV_IMAGE_NAME=${REG}/${OWNER}/egtv:${VER}
          EGBLOG_IMAGE_NAME=${REG}/${OWNER}/egblog:${VER}
          EGADMIN_IMAGE_NAME=${REG}/${OWNER}/egadmin:${VER}

          EGFILM_PORT=${{ vars.EGFILM_PORT || '8000' }}
          EGSPORT_PORT=${{ vars.EGSPORT_PORT || '5555' }}
          EGTV_PORT=${{ vars.EGTV_PORT || '3333' }}
          EGBLOG_PORT=${{ vars.EGBLOG_PORT || '4444' }}
          EGADMIN_PORT=${{ vars.EGADMIN_PORT || '5566' }}

          EGFILM_URL=${{ vars.EGFILM_URL || 'https://egfilm.xyz' }}
          EGSPORT_URL=${{ vars.EGSPORT_URL || 'https://sports.egfilm.xyz' }}
          EGTV_URL=${{ vars.EGTV_URL || 'https://tv.egfilm.xyz' }}
          EGBLOG_URL=${{ vars.EGBLOG_URL || 'https://blog.egfilm.xyz' }}
          EGADMIN_URL=${{ vars.EGADMIN_URL || 'https://admin.egfilm.xyz' }}

          EGFILM_AUTH_URL=${{ vars.EGFILM_URL || 'https://egfilm.xyz' }}
          EGSPORT_AUTH_URL=${{ vars.EGSPORT_URL || 'https://sports.egfilm.xyz' }}
          EGTV_AUTH_URL=${{ vars.EGTV_URL || 'https://tv.egfilm.xyz' }}
          EGBLOG_AUTH_URL=${{ vars.EGBLOG_URL || 'https://blog.egfilm.xyz' }}
          EGADMIN_AUTH_URL=${{ vars.EGADMIN_URL || 'https://admin.egfilm.xyz' }}

          NEXT_PUBLIC_BLOG_SITE_URL=${{ vars.BLOG_SITE_URL || 'https://blog.egfilm.xyz' }}
          NEXT_PUBLIC_TURN_SERVER=${{ vars.TURN_SERVER || '' }}
          NEXT_PUBLIC_TURN_USERNAME=${{ vars.TURN_USERNAME || '' }}
          TURN_PASSWORD=${{ secrets.TURN_PASSWORD || '' }}
          NEXT_PUBLIC_GA_MEASUREMENT_ID=${{ vars.GA_MEASUREMENT_ID }}
          NEXT_PUBLIC_BUILD_VERSION=${VER}
          NEXT_PUBLIC_GIT_SHA=${{ github.sha }}
          DEPLOY_APPS="${{ needs.validate.outputs.apps }}"
          EOF

      - name: 📤 Copy files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ vars.SERVER_HOST }}
          username: ${{ vars.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ vars.SSH_PORT || 22 }}
          source: ".env,deploy.sh,docker-compose.yml"
          target: "~/egfilm/"
          overwrite: true

      - name: 🚀 Execute deploy.sh
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.SERVER_HOST }}
          username: ${{ vars.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ vars.SSH_PORT || 22 }}
          command_timeout: 20m
          script: |
            cd ~/egfilm
            chmod +x deploy.sh
            bash deploy.sh

      - name: 🧪 Smoke tests
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.SERVER_HOST }}
          username: ${{ vars.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ vars.SSH_PORT || 22 }}
          script: |
            set -e
            for p in "${{ vars.EGFILM_PORT || '8000' }}" "${{ vars.EGSPORT_PORT || '5555' }}" "${{ vars.EGTV_PORT || '3333' }}" "${{ vars.EGBLOG_PORT || '4444' }}" "${{ vars.EGADMIN_PORT || '5566' }}"; do
              echo -n "  :$p/api/health … "
              curl -sf "http://localhost:$p/api/health" >/dev/null && echo "✅" || { echo "❌"; exit 1; }
            done

  report:
    name: 📊 Deployment Report
    runs-on: ubuntu-latest
    needs: [validate, build, deploy]
    if: always()
    steps:
      - run: |
          echo "# 🚀 Monorepo Deployment Report" >> "$GITHUB_STEP_SUMMARY"
          if [[ "${{ needs.deploy.result }}" == "success" ]]; then
            echo "## ✅ Deployment Successful" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## ❌ Deployment Failed (${{ needs.deploy.result }})" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "- **Version**: ${{ needs.validate.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Apps**: egfilm, egsport, egtv, egblog, egadmin" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Triggered by**: ${{ github.event_name }}" >> "$GITHUB_STEP_SUMMARY"
