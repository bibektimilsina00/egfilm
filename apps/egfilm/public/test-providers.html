<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="robots" content="noindex,nofollow" />
<title>Provider Smoke Test · EGFilm</title>
<style>
  :root {
    --bg: #0a0a0f;
    --panel: #14141c;
    --panel-2: #1c1c26;
    --border: #2a2a36;
    --text: #e6e6ee;
    --muted: #888894;
    --accent: #5b8def;
    --accent-2: #7c5cff;
    --ok: #34d399;
    --warn: #fbbf24;
    --err: #f87171;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
  }
  header {
    padding: 24px 28px 12px;
    border-bottom: 1px solid var(--border);
    background: linear-gradient(180deg, #0d0d14, var(--bg));
  }
  h1 {
    margin: 0 0 4px;
    font-size: 22px;
    font-weight: 800;
    letter-spacing: -0.02em;
  }
  header p { margin: 0; color: var(--muted); font-size: 13px; }

  .controls {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    padding: 16px 28px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    align-items: end;
  }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
  input, select {
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 13px;
    outline: none;
  }
  input:focus, select:focus { border-color: var(--accent); }
  input[type=number] { width: 90px; }

  button {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: white;
    border: 0;
    border-radius: 8px;
    padding: 9px 16px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: transform .1s ease, box-shadow .2s ease;
  }
  button:hover { transform: translateY(-1px); box-shadow: 0 4px 14px rgba(91, 141, 239, 0.25); }
  button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }
  button.ghost {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
    padding: 7px 11px;
    font-weight: 500;
  }
  button.ghost:hover { border-color: var(--accent); box-shadow: none; }

  .sample-chips {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    padding: 0 28px 16px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
  }
  .chip {
    font-size: 11px;
    padding: 4px 10px;
    border-radius: 999px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--muted);
    cursor: pointer;
    user-select: none;
  }
  .chip:hover { color: var(--text); border-color: var(--accent); }
  .chip[data-section] { font-weight: 700; color: var(--accent); border-color: transparent; background: transparent; cursor: default; }

  .status-bar {
    padding: 12px 28px;
    display: flex;
    gap: 16px;
    align-items: center;
    font-size: 12px;
    color: var(--muted);
    border-bottom: 1px solid var(--border);
  }
  .pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 3px 9px;
    border-radius: 999px;
    background: var(--panel-2);
    border: 1px solid var(--border);
  }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); }
  .dot.loading { background: var(--warn); animation: pulse 1.2s ease-in-out infinite; }
  .dot.ok { background: var(--ok); }
  .dot.warn { background: var(--warn); }
  .dot.err { background: var(--err); }
  @keyframes pulse { 0%,100% { opacity: 0.4; } 50% { opacity: 1; } }

  main { padding: 24px 28px; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
    gap: 18px;
  }

  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .card-head {
    padding: 12px 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    border-bottom: 1px solid var(--border);
    background: var(--panel-2);
  }
  .card-head .name { font-weight: 700; font-size: 13px; }
  .card-head .meta { font-size: 11px; color: var(--muted); margin-top: 2px; display: flex; gap: 6px; flex-wrap: wrap; }
  .badge { background: rgba(124, 92, 255, 0.15); color: #b9a8ff; padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }
  .card-actions { display: flex; gap: 6px; }
  .iframe-wrap {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    background: #000;
  }
  .iframe-wrap iframe { width: 100%; height: 100%; border: 0; }
  .iframe-overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    background: rgba(0, 0, 0, 0.7);
    color: var(--muted);
    font-size: 13px;
    pointer-events: none;
    transition: opacity .25s ease;
  }
  .iframe-overlay.hide { opacity: 0; }
  .spinner {
    width: 28px; height: 28px;
    border: 3px solid rgba(255,255,255,0.1);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .card-foot {
    padding: 9px 14px;
    border-top: 1px solid var(--border);
    font-size: 11px;
    color: var(--muted);
    background: var(--panel-2);
    display: flex;
    align-items: center;
    gap: 10px;
    word-break: break-all;
  }
  .card-foot code {
    flex: 1;
    font-family: ui-monospace, "SF Mono", Consolas, monospace;
    font-size: 11px;
    color: var(--text);
    background: var(--bg);
    padding: 4px 8px;
    border-radius: 5px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .empty {
    grid-column: 1 / -1;
    text-align: center;
    padding: 80px 20px;
    color: var(--muted);
  }
  .empty strong { color: var(--text); display: block; margin-bottom: 6px; font-size: 16px; }

  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--panel-2);
    border: 1px solid var(--border);
    padding: 10px 18px;
    border-radius: 10px;
    font-size: 12px;
    transition: transform 0.25s ease;
    z-index: 100;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<header>
  <h1>🎬 Provider Smoke Test</h1>
  <p>Test every streaming provider in parallel against a TMDB ID. Quickly spot which embeds are broken.</p>
</header>

<div class="controls">
  <div class="field" style="flex: 1; min-width: 260px;">
    <label>API base URL <span style="color:var(--muted);font-weight:400;text-transform:none;">(empty = same origin)</span></label>
    <input id="apiBase" type="text" placeholder="http://localhost:8000" />
  </div>
  <div class="field">
    <label>Type</label>
    <select id="kind">
      <option value="movie">Movie</option>
      <option value="tv">TV Show</option>
    </select>
  </div>
  <div class="field">
    <label>TMDB ID</label>
    <input id="tmdb" type="number" placeholder="e.g. 27205" />
  </div>
  <div class="field tv-only" hidden>
    <label>Season</label>
    <input id="season" type="number" value="1" min="1" />
  </div>
  <div class="field tv-only" hidden>
    <label>Episode</label>
    <input id="episode" type="number" value="1" min="1" />
  </div>
  <button id="run">▶ Test All Providers</button>
  <button class="ghost" id="reload-providers">↻ Refresh providers</button>
  <button class="ghost" id="reload-all">↻ Reload all iframes</button>
</div>

<div class="sample-chips" id="samples">
  <span class="chip" data-section>MOVIES</span>
  <!-- filled by JS -->
</div>

<div class="status-bar">
  <span class="pill"><span class="dot" id="dot-providers"></span> <span id="providers-count">loading providers…</span></span>
  <span class="pill"><span class="dot ok"></span> <span id="ok-count">0</span> loaded</span>
  <span class="pill"><span class="dot err"></span> <span id="err-count">0</span> errored</span>
  <span class="pill"><span class="dot loading"></span> <span id="loading-count">0</span> loading</span>
</div>

<main>
  <div class="grid" id="grid">
    <div class="empty">
      <strong>Enter a TMDB ID and hit Test All Providers</strong>
      Or tap one of the sample chips above.
    </div>
  </div>
</main>

<div class="toast" id="toast"></div>

<script>
  const SAMPLES = {
    movie: [
      { id: 27205, name: 'Inception' },
      { id: 550, name: 'Fight Club' },
      { id: 155, name: 'The Dark Knight' },
      { id: 13, name: 'Forrest Gump' },
      { id: 680, name: 'Pulp Fiction' },
      { id: 24428, name: 'The Avengers' },
      { id: 603, name: 'The Matrix' },
      { id: 533535, name: 'Deadpool & Wolverine' },
      { id: 1011477, name: 'Kraven the Hunter' },
      { id: 912649, name: 'Venom: The Last Dance' },
    ],
    tv: [
      { id: 1399, name: 'Game of Thrones', s: 1, e: 1 },
      { id: 1396, name: 'Breaking Bad', s: 1, e: 1 },
      { id: 1668, name: 'Friends', s: 1, e: 1 },
      { id: 100088, name: 'The Last of Us', s: 1, e: 1 },
      { id: 94997, name: 'House of the Dragon', s: 1, e: 1 },
      { id: 60735, name: 'The Flash', s: 1, e: 1 },
    ],
  };

  // Baked fallback (matches packages/db/prisma/seed-video-providers.ts, isEnabled only)
  const BAKED_PROVIDERS = [
    { id: 'b-vidsrc-icu',   name: 'VidSrc ICU',   slug: 'vidsrc-icu',   quality: '1080p', isDefault: true,  hasMultiQuality: true, hasSubtitles: true, hasAutoplay: false, movieTemplate: 'https://vidsrc.icu/embed/movie/{tmdbId}',           tvTemplate: 'https://vidsrc.icu/embed/tv/{tmdbId}/{season}/{episode}' },
    { id: 'b-vidsrc-cc',    name: 'VidSrc.cc',    slug: 'vidsrc-cc',    quality: '1080p', isDefault: false, hasMultiQuality: true, hasSubtitles: true, hasAutoplay: false, movieTemplate: 'https://vidsrc.cc/v2/embed/movie/{tmdbId}',         tvTemplate: 'https://vidsrc.cc/v2/embed/tv/{tmdbId}/{season}/{episode}' },
    { id: 'b-vidlink-pro',  name: 'VidLink Pro',  slug: 'vidlink-pro',  quality: '1080p', isDefault: false, hasMultiQuality: true, hasSubtitles: true, hasAutoplay: false, movieTemplate: 'https://vidlink.pro/movie/{tmdbId}',                tvTemplate: 'https://vidlink.pro/tv/{tmdbId}/{season}/{episode}' },
    { id: 'b-vidsrc-to',    name: 'VidSrc.to',    slug: 'vidsrc-to',    quality: '1080p', isDefault: false, hasMultiQuality: true, hasSubtitles: true, hasAutoplay: false, movieTemplate: 'https://vidsrc.to/embed/movie/{tmdbId}',            tvTemplate: 'https://vidsrc.to/embed/tv/{tmdbId}/{season}/{episode}' },
    { id: 'b-vidsrc-net',   name: 'VidSrc.net',   slug: 'vidsrc-net',   quality: '1080p', isDefault: false, hasMultiQuality: true, hasSubtitles: true, hasAutoplay: false, movieTemplate: 'https://vidsrc.net/embed/movie/{tmdbId}',           tvTemplate: 'https://vidsrc.net/embed/tv/{tmdbId}/{season}/{episode}' },
    { id: 'b-vidsrc-me',    name: 'VidSrc.me',    slug: 'vidsrc-me',    quality: '1080p', isDefault: false, hasMultiQuality: true, hasSubtitles: true, hasAutoplay: false, movieTemplate: 'https://vidsrc.me/embed/movie?tmdb={tmdbId}',       tvTemplate: 'https://vidsrc.me/embed/tv?tmdb={tmdbId}&season={season}&episode={episode}' },
    { id: 'b-vidsrc-new',   name: 'VidSrc NEW',   slug: 'vidsrc-new',   quality: '1080p', isDefault: false, hasMultiQuality: true, hasSubtitles: true, hasAutoplay: false, movieTemplate: 'https://vidsrcme.ru/embed/movie/{tmdbId}',          tvTemplate: 'https://vidsrcme.ru/embed/tv/{tmdbId}/{season}/{episode}' },
    { id: 'b-vidsrc-xyz',   name: 'VidSrc.xyz',   slug: 'vidsrc-xyz',   quality: '1080p', isDefault: false, hasMultiQuality: true, hasSubtitles: true, hasAutoplay: false, movieTemplate: 'https://vidsrc.xyz/embed/movie/{tmdbId}',           tvTemplate: 'https://vidsrc.xyz/embed/tv/{tmdbId}/{season}/{episode}' },
    { id: 'b-2embed',       name: '2Embed',       slug: '2embed',       quality: '1080p', isDefault: false, hasMultiQuality: true, hasSubtitles: true, hasAutoplay: false, movieTemplate: 'https://www.2embed.cc/embed/{tmdbId}',              tvTemplate: 'https://www.2embed.cc/embedtv/{tmdbId}&s={season}&e={episode}' },
    { id: 'b-superembed',   name: 'SuperEmbed',   slug: 'superembed',   quality: '1080p', isDefault: false, hasMultiQuality: true, hasSubtitles: true, hasAutoplay: false, movieTemplate: 'https://multiembed.mov/?video_id={tmdbId}&tmdb=1',  tvTemplate: 'https://multiembed.mov/?video_id={tmdbId}&tmdb=1&s={season}&e={episode}' },
    { id: 'b-moviesapi',    name: 'MoviesAPI',    slug: 'moviesapi',    quality: '1080p', isDefault: false, hasMultiQuality: true, hasSubtitles: true, hasAutoplay: false, movieTemplate: 'https://moviesapi.club/movie/{tmdbId}',             tvTemplate: 'https://moviesapi.club/tv/{tmdbId}-{season}-{episode}' },
    { id: 'b-smashystream', name: 'Smashystream', slug: 'smashystream', quality: '1080p', isDefault: false, hasMultiQuality: true, hasSubtitles: true, hasAutoplay: false, movieTemplate: 'https://embed.smashystream.com/playere.php?tmdb={tmdbId}', tvTemplate: 'https://embed.smashystream.com/playere.php?tmdb={tmdbId}&season={season}&episode={episode}' },
  ];

  const $ = (id) => document.getElementById(id);
  const grid = $('grid');
  const samplesBox = $('samples');
  const toast = $('toast');
  let providers = [];
  let cards = new Map(); // provider.id -> { card, status, watchdog }
  let counts = { ok: 0, err: 0, loading: 0 };

  // ---------------- Sample chips ----------------
  function renderSamples() {
    samplesBox.innerHTML = '';
    const heading = (label) => {
      const el = document.createElement('span');
      el.className = 'chip';
      el.dataset.section = 'true';
      el.textContent = label;
      return el;
    };
    samplesBox.appendChild(heading('MOVIES'));
    for (const m of SAMPLES.movie) {
      const c = document.createElement('span');
      c.className = 'chip';
      c.textContent = `${m.name} (${m.id})`;
      c.onclick = () => {
        $('kind').value = 'movie';
        $('tmdb').value = m.id;
        updateTvVisibility();
        run();
      };
      samplesBox.appendChild(c);
    }
    samplesBox.appendChild(heading('TV'));
    for (const t of SAMPLES.tv) {
      const c = document.createElement('span');
      c.className = 'chip';
      c.textContent = `${t.name} (${t.id} S${t.s}E${t.e})`;
      c.onclick = () => {
        $('kind').value = 'tv';
        $('tmdb').value = t.id;
        $('season').value = t.s;
        $('episode').value = t.e;
        updateTvVisibility();
        run();
      };
      samplesBox.appendChild(c);
    }
  }

  // ---------------- URL helpers ----------------
  function gen(template, id, season, episode) {
    let u = (template || '').replace('{tmdbId}', String(id));
    if (season != null) u = u.replace('{season}', String(season));
    if (episode != null) u = u.replace('{episode}', String(episode));
    return u;
  }

  // ---------------- Provider load ----------------
  function getApiBase() {
    return ($('apiBase').value || '').trim().replace(/\/$/, '');
  }

  function applyBaked(reason) {
    providers = BAKED_PROVIDERS.slice();
    $('providers-count').textContent = `${providers.length} providers (baked${reason ? ' — ' + reason : ''})`;
    setDot('providers', 'warn');
  }

  async function loadProviders() {
    setDot('providers', 'loading');
    $('providers-count').textContent = 'loading providers…';
    const base = getApiBase();
    const url = `${base}/api/video-providers`;
    try {
      const res = await fetch(url, { cache: 'no-store' });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const ct = res.headers.get('content-type') || '';
      if (!ct.includes('application/json')) {
        const peek = (await res.text()).slice(0, 80);
        throw new Error(`Non-JSON: ${peek}…`);
      }
      const data = await res.json();
      const list = Array.isArray(data) ? data : (data.providers ?? []);
      if (!list.length) {
        applyBaked('API returned empty');
        return;
      }
      providers = list;
      $('providers-count').textContent = `${providers.length} providers (live)`;
      setDot('providers', 'ok');
    } catch (e) {
      console.warn('API fetch failed, using baked list:', e.message, url);
      applyBaked('API unreachable');
    }
  }

  function setDot(id, kind) {
    const dot = $(`dot-${id}`);
    if (!dot) return;
    dot.classList.remove('loading', 'ok', 'warn', 'err');
    if (kind) dot.classList.add(kind);
  }

  // ---------------- Toast ----------------
  let toastTimer;
  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 1800);
  }

  // ---------------- Run smoke test ----------------
  function updateTvVisibility() {
    const tv = $('kind').value === 'tv';
    document.querySelectorAll('.tv-only').forEach((el) => el.hidden = !tv);
  }

  function updateCounts() {
    $('ok-count').textContent = counts.ok;
    $('err-count').textContent = counts.err;
    $('loading-count').textContent = counts.loading;
  }

  function makeCard(provider, url) {
    const card = document.createElement('div');
    card.className = 'card';

    const head = document.createElement('div');
    head.className = 'card-head';

    const meta = document.createElement('div');
    const name = document.createElement('div');
    name.className = 'name';
    name.textContent = provider.name;
    const sub = document.createElement('div');
    sub.className = 'meta';
    const q = document.createElement('span');
    q.className = 'badge';
    q.textContent = provider.quality || '—';
    sub.appendChild(q);
    if (provider.hasMultiQuality) sub.appendChild(badge('multi-quality'));
    if (provider.hasSubtitles) sub.appendChild(badge('subs'));
    if (provider.hasAutoplay) sub.appendChild(badge('autoplay'));
    if (provider.isDefault) sub.appendChild(badge('default'));
    meta.appendChild(name);
    meta.appendChild(sub);

    const actions = document.createElement('div');
    actions.className = 'card-actions';
    const reload = ghostBtn('↻', 'Reload iframe');
    reload.onclick = () => reloadCard(provider.id, url);
    const open = ghostBtn('↗', 'Open in new tab');
    open.onclick = () => window.open(url, '_blank', 'noopener,noreferrer');
    const copy = ghostBtn('⎘', 'Copy URL');
    copy.onclick = async () => {
      try { await navigator.clipboard.writeText(url); showToast('URL copied'); } catch { showToast('copy failed'); }
    };
    actions.append(reload, open, copy);

    head.append(meta, actions);

    const wrap = document.createElement('div');
    wrap.className = 'iframe-wrap';
    const frame = document.createElement('iframe');
    frame.src = url;
    frame.referrerPolicy = 'no-referrer';
    frame.allow = 'autoplay; fullscreen; picture-in-picture; encrypted-media';
    frame.allowFullscreen = true;
    const overlay = document.createElement('div');
    overlay.className = 'iframe-overlay';
    overlay.innerHTML = '<div class="spinner"></div><span>Loading…</span>';
    wrap.append(frame, overlay);

    const foot = document.createElement('div');
    foot.className = 'card-foot';
    const code = document.createElement('code');
    code.textContent = url;
    foot.appendChild(code);

    card.append(head, wrap, foot);

    // status watchdog: if iframe never fires `load` in 12s = mark errored.
    let loaded = false;
    counts.loading++;
    updateCounts();

    const watchdog = setTimeout(() => {
      if (loaded) return;
      counts.loading--;
      counts.err++;
      updateCounts();
      overlay.innerHTML = '<div style="font-size:24px">⚠️</div><span>Timed out (12s) — likely blocked or unreachable.</span>';
      overlay.style.background = 'rgba(120, 20, 20, 0.65)';
      overlay.style.color = '#fff';
      cards.get(provider.id).status = 'err';
    }, 12000);

    frame.addEventListener('load', () => {
      if (loaded) return;
      loaded = true;
      clearTimeout(watchdog);
      counts.loading--;
      counts.ok++;
      updateCounts();
      overlay.classList.add('hide');
      cards.get(provider.id).status = 'ok';
    });

    cards.set(provider.id, { card, status: 'loading', watchdog, overlay, frame, url });
    return card;
  }

  function badge(text) {
    const b = document.createElement('span');
    b.className = 'badge';
    b.style.background = 'rgba(91,141,239,0.12)';
    b.style.color = '#a5c5ff';
    b.textContent = text;
    return b;
  }

  function ghostBtn(label, title) {
    const b = document.createElement('button');
    b.className = 'ghost';
    b.textContent = label;
    b.title = title;
    b.style.padding = '5px 9px';
    return b;
  }

  function reloadCard(id, url) {
    const c = cards.get(id);
    if (!c) return;
    if (c.status === 'loading') counts.loading--;
    if (c.status === 'ok') counts.ok--;
    if (c.status === 'err') counts.err--;
    counts.loading++;
    updateCounts();
    clearTimeout(c.watchdog);
    c.overlay.classList.remove('hide');
    c.overlay.innerHTML = '<div class="spinner"></div><span>Loading…</span>';
    c.overlay.style.background = 'rgba(0,0,0,0.7)';
    c.overlay.style.color = 'var(--muted)';
    c.status = 'loading';
    c.frame.src = url + (url.includes('?') ? '&' : '?') + '_r=' + Date.now();

    const watchdog = setTimeout(() => {
      counts.loading--;
      counts.err++;
      updateCounts();
      c.overlay.innerHTML = '<div style="font-size:24px">⚠️</div><span>Timed out.</span>';
      c.overlay.style.background = 'rgba(120, 20, 20, 0.65)';
      c.overlay.style.color = '#fff';
      c.status = 'err';
    }, 12000);
    c.watchdog = watchdog;

    c.frame.addEventListener('load', () => {
      clearTimeout(watchdog);
      counts.loading--;
      counts.ok++;
      updateCounts();
      c.overlay.classList.add('hide');
      c.status = 'ok';
    }, { once: true });
  }

  function run() {
    const id = parseInt($('tmdb').value, 10);
    if (!id || Number.isNaN(id)) { showToast('Enter a TMDB ID'); return; }
    const kind = $('kind').value;
    const season = kind === 'tv' ? parseInt($('season').value, 10) : undefined;
    const episode = kind === 'tv' ? parseInt($('episode').value, 10) : undefined;

    if (!providers.length) { showToast('No providers loaded'); return; }

    // reset
    cards.forEach((c) => clearTimeout(c.watchdog));
    cards.clear();
    counts = { ok: 0, err: 0, loading: 0 };
    updateCounts();
    grid.innerHTML = '';

    for (const p of providers) {
      const tpl = kind === 'movie' ? p.movieTemplate : p.tvTemplate;
      if (!tpl) continue;
      const url = gen(tpl, id, season, episode);
      grid.appendChild(makeCard(p, url));
    }
  }

  function reloadAll() {
    cards.forEach((c, id) => reloadCard(id, c.url));
  }

  // ---------------- Wire up ----------------
  $('kind').addEventListener('change', updateTvVisibility);
  $('run').addEventListener('click', run);
  $('reload-providers').addEventListener('click', loadProviders);
  $('reload-all').addEventListener('click', reloadAll);

  // API base: prefer ?api=... query, then localStorage, then empty (same-origin).
  (() => {
    const qs = new URLSearchParams(location.search);
    const fromQs = qs.get('api');
    const fromLs = localStorage.getItem('egfilm.providerTester.api') || '';
    $('apiBase').value = fromQs ?? fromLs;
    $('apiBase').addEventListener('change', () => {
      localStorage.setItem('egfilm.providerTester.api', $('apiBase').value.trim());
      loadProviders();
    });
  })();

  renderSamples();
  updateTvVisibility();
  loadProviders();
</script>
</body>
</html>
