services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 3s
      retries: 5
    ports:
      - "5432:5432"

  egfilm:
    image: ${EGFILM_IMAGE_NAME:-ghcr.io/bibektimilsina00/egfilm:latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${EGFILM_PORT:-8000}:3000"
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: 1
      DATABASE_URL: ${DATABASE_URL}
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_TRUST_HOST: ${AUTH_TRUST_HOST:-true}
      AUTH_COOKIE_DOMAIN: ${AUTH_COOKIE_DOMAIN:-}
      AUTH_URL: ${EGFILM_AUTH_URL}
      NEXTAUTH_URL: ${EGFILM_AUTH_URL}
      TMDB_API_KEY: ${TMDB_API_KEY}
      NEXT_PUBLIC_TMDB_API_KEY: ${TMDB_API_KEY}
      NEXT_PUBLIC_APP_NAME: EGFilm
      NEXT_PUBLIC_APP_URL: ${EGFILM_URL}
      NEXT_PUBLIC_EGFILM_URL: ${EGFILM_URL}
      NEXT_PUBLIC_EGSPORT_URL: ${EGSPORT_URL}
      NEXT_PUBLIC_BLOG_SITE_URL: ${NEXT_PUBLIC_BLOG_SITE_URL:-}
      NEXT_PUBLIC_TURN_SERVER: ${NEXT_PUBLIC_TURN_SERVER:-}
      NEXT_PUBLIC_TURN_USERNAME: ${NEXT_PUBLIC_TURN_USERNAME:-}
      TURN_PASSWORD: ${TURN_PASSWORD:-}
      NEXT_PUBLIC_GA_MEASUREMENT_ID: ${NEXT_PUBLIC_GA_MEASUREMENT_ID:-}

  egsport:
    image: ${EGSPORT_IMAGE_NAME:-ghcr.io/bibektimilsina00/egsport:latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${EGSPORT_PORT:-5555}:3000"
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: 1
      DATABASE_URL: ${DATABASE_URL}
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_TRUST_HOST: ${AUTH_TRUST_HOST:-true}
      AUTH_COOKIE_DOMAIN: ${AUTH_COOKIE_DOMAIN:-}
      AUTH_URL: ${EGSPORT_AUTH_URL}
      NEXTAUTH_URL: ${EGSPORT_AUTH_URL}
      NEXT_PUBLIC_APP_NAME: EGSport
      NEXT_PUBLIC_APP_URL: ${EGSPORT_URL}
      NEXT_PUBLIC_EGFILM_URL: ${EGFILM_URL}
      NEXT_PUBLIC_EGSPORT_URL: ${EGSPORT_URL}
      NEXT_PUBLIC_BLOG_SITE_URL: ${NEXT_PUBLIC_BLOG_SITE_URL:-}
      NEXT_PUBLIC_TURN_SERVER: ${NEXT_PUBLIC_TURN_SERVER:-}
      NEXT_PUBLIC_TURN_USERNAME: ${NEXT_PUBLIC_TURN_USERNAME:-}
      TURN_PASSWORD: ${TURN_PASSWORD:-}
      NEXT_PUBLIC_GA_MEASUREMENT_ID: ${NEXT_PUBLIC_GA_MEASUREMENT_ID:-}

  egtv:
    image: ${EGTV_IMAGE_NAME:-ghcr.io/bibektimilsina00/egtv:latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${EGTV_PORT:-3333}:3000"
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: 1
      DATABASE_URL: ${DATABASE_URL}
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_TRUST_HOST: ${AUTH_TRUST_HOST:-true}
      AUTH_COOKIE_DOMAIN: ${AUTH_COOKIE_DOMAIN:-}
      AUTH_URL: ${EGTV_AUTH_URL}
      NEXTAUTH_URL: ${EGTV_AUTH_URL}
      NEXT_PUBLIC_APP_NAME: EGTV
      NEXT_PUBLIC_APP_URL: ${EGTV_URL}
      NEXT_PUBLIC_EGFILM_URL: ${EGFILM_URL}
      NEXT_PUBLIC_EGSPORT_URL: ${EGSPORT_URL}
      NEXT_PUBLIC_EGTV_URL: ${EGTV_URL}
      NEXT_PUBLIC_BLOG_SITE_URL: ${NEXT_PUBLIC_BLOG_SITE_URL:-}
      NEXT_PUBLIC_TURN_SERVER: ${NEXT_PUBLIC_TURN_SERVER:-}
      NEXT_PUBLIC_TURN_USERNAME: ${NEXT_PUBLIC_TURN_USERNAME:-}
      TURN_PASSWORD: ${TURN_PASSWORD:-}
      NEXT_PUBLIC_GA_MEASUREMENT_ID: ${NEXT_PUBLIC_GA_MEASUREMENT_ID:-}

  egblog:
    image: ${EGBLOG_IMAGE_NAME:-ghcr.io/bibektimilsina00/egblog:latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${EGBLOG_PORT:-4444}:3000"
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: 1
      DATABASE_URL: ${DATABASE_URL}
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_TRUST_HOST: ${AUTH_TRUST_HOST:-true}
      AUTH_COOKIE_DOMAIN: ${AUTH_COOKIE_DOMAIN:-}
      AUTH_URL: ${EGBLOG_AUTH_URL}
      NEXTAUTH_URL: ${EGBLOG_AUTH_URL}
      NEXT_PUBLIC_APP_NAME: EGFilm Blog
      NEXT_PUBLIC_APP_URL: ${EGBLOG_URL}
      NEXT_PUBLIC_EGFILM_URL: ${EGFILM_URL}
      NEXT_PUBLIC_EGSPORT_URL: ${EGSPORT_URL}
      NEXT_PUBLIC_EGTV_URL: ${EGTV_URL}
      NEXT_PUBLIC_EGBLOG_URL: ${EGBLOG_URL}
      NEXT_PUBLIC_GA_MEASUREMENT_ID: ${NEXT_PUBLIC_GA_MEASUREMENT_ID:-}

  egadmin:
    image: ${EGADMIN_IMAGE_NAME:-ghcr.io/bibektimilsina00/egadmin:latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${EGADMIN_PORT:-5566}:3000"
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: 1
      DATABASE_URL: ${DATABASE_URL}
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_TRUST_HOST: ${AUTH_TRUST_HOST:-true}
      AUTH_COOKIE_DOMAIN: ${AUTH_COOKIE_DOMAIN:-}
      AUTH_URL: ${EGADMIN_AUTH_URL}
      NEXTAUTH_URL: ${EGADMIN_AUTH_URL}
      TMDB_API_KEY: ${TMDB_API_KEY}
      NEXT_PUBLIC_TMDB_API_KEY: ${TMDB_API_KEY}
      NEXT_PUBLIC_APP_NAME: EGFilm Admin
      NEXT_PUBLIC_APP_URL: ${EGADMIN_URL}
      NEXT_PUBLIC_EGFILM_URL: ${EGFILM_URL}
      NEXT_PUBLIC_EGSPORT_URL: ${EGSPORT_URL}
      NEXT_PUBLIC_EGTV_URL: ${EGTV_URL}
      NEXT_PUBLIC_EGBLOG_URL: ${EGBLOG_URL}
      NEXT_PUBLIC_EGADMIN_URL: ${EGADMIN_URL}
      NEXT_PUBLIC_GA_MEASUREMENT_ID: ${NEXT_PUBLIC_GA_MEASUREMENT_ID:-}

volumes:
  postgres_data:
